[package]
name = "tezbar-amphetamine"
version = "1.1.1"
edition = "2021"
license = "Apache-2.0 AND MIT"
description = "Standalone Rust Amphetamine process extension"
repository = "https://github.com/almatkai/amphetamine"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process", "fs", "net"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "9f91afcc071c3f301414dc62b33cfeac7d89a0cf" }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
